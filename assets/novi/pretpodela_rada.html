<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>Pretpodela rada — krojacnica</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#ECEFF1;
     height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* Zaglavlje */
#hdr{background:linear-gradient(135deg,#0D47A1,#1565C0);color:#fff;
     padding:7px 14px;display:flex;align-items:center;
     justify-content:space-between;flex-shrink:0}
#hdr h1{font-size:16px;font-weight:700;letter-spacing:.5px}
#hdr .sub{font-size:10px;color:#90CAF9;margin-top:2px}
#clock{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}

/* Navigacijska traka */
#nav{background:#1A237E;padding:5px 12px;display:flex;gap:6px;justify-content:center;
     align-items:center;flex-wrap:wrap;flex-shrink:0;
     border-bottom:2px solid #0D47A1}
.nl{color:#90CAF9;font-size:10px;text-transform:uppercase;
    letter-spacing:.5px;margin-right:2px}
.db{padding:4px 11px;font-size:11px;font-weight:700;
    border:1px solid #3F51B5;border-radius:3px;cursor:pointer;
    background:transparent;color:#90CAF9;transition:all .15s}
.db:hover{background:#283593;color:#fff}
.db.sel{background:#1565C0;color:#fff;border-color:#90CAF9}
.db.sada{background:#B71C1C;color:#fff;border-color:#EF9A9A}
.db.sada.sel{background:#D32F2F;border-color:#fff}
.sep{width:1px;height:20px;background:#283593;margin:0 4px}
.nav-br{flex-basis:100%;height:0}   /* prelom: 1. red dani + datum, 2. red radnje (2026-10-07) */
.ci{display:flex;flex-direction:column}
.cl{color:#90CAF9;font-size:9px;text-transform:uppercase}
.cv{color:#fff;font-size:12px;font-weight:600;min-width:60px}
#di{background:transparent;border:1px solid #5C6BC0;color:#fff;
    padding:2px 5px;font-size:11px;border-radius:3px}
#di::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.6}
.btn{padding:3px 8px;font-size:11px;font-weight:600;border:none;
     border-radius:3px;cursor:pointer}
#sndBtn{background:#37474F;color:#fff}
#sndBtn.on{background:#2E7D32}

/* Glavni layout */
#main{display:flex;flex:1;overflow:hidden}

/* Levo: staticni plan — SAKRIVEN (Fini plan je zaseban prozor, W1) */
#lp{display:none}
#lt{background:#E3F2FD;padding:4px 10px;font-size:11px;font-weight:700;
    color:#0D47A1;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
#sw{flex:1;overflow:hidden}
#sg{width:100%;height:100%}

/* Desno: pretpodela */
#rp{flex:1;display:flex;flex-direction:column;background:#FAFAFA}
#rt{background:#FFF3E0;padding:4px 10px;font-size:11px;font-weight:700;
    color:#E65100;text-transform:uppercase;letter-spacing:.5px;
    display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
#si{font-size:10px;color:#BF360C;font-weight:400}
#pm{display:flex;flex:1;overflow:hidden}
#pw{flex:1;overflow:hidden;position:relative}
#pg{width:100%;height:100%}
#pw.mv #pg{cursor:grab}
#pw.mv.drag #pg{cursor:grabbing}
#mvBtn.on{background:#6A1B9A;color:#fff;border-color:#CE93D8}
#mvGhost{position:absolute;pointer-events:none;z-index:30;border:2px dashed #4A148C;
         background:rgba(106,27,154,.25);border-radius:3px;display:none;
         font:700 9px 'Segoe UI';color:#4A148C;align-items:center;justify-content:center}

@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* Toast */
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
       background:#BF360C;color:#fff;padding:10px 14px 10px 18px;border-radius:5px;
       font-size:12px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.4);
       display:none;z-index:9999;max-width:480px;text-align:center;
       animation:blink .9s ease-in-out infinite}
#toast-x{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:3px;
       width:20px;height:20px;cursor:pointer;font-size:11px;line-height:1;
       vertical-align:middle;margin-left:10px}
#toast-x:hover{background:rgba(255,255,255,.32)}

/* Trepci dot */
#rdot{width:7px;height:7px;border-radius:50%;background:#69F0AE;
      display:inline-block;margin-left:5px;transition:background .3s}
#rdot.u{background:#FFB300}

/* Puni ekran (korisnikov zahtev 2026-08-16, za lakšu analizu po danima) --
   sakriva zaglavlje (#hdr), Gantt (#pw, vec flex:1) tako dobija CEO ekran.
   Trazi se native browser Fullscreen API (document.documentElement) preko
   toggleFS() -- .fs klasa na body-ju samo diktira RASPORED unutar te
   fullscreen povrsine, ne sama izaziva fullscreen. */
body.fs #hdr{display:none}
body.fs #main{flex:1}
#fsBtn.on{background:#1565C0;color:#fff}
</style>
</head>
<body>

<div id="hdr">
  <div>
    <h1>PRETPODELA RADA
        <span id="rdot"></span></h1>
    <div class="sub">Statički model Nivo 1 &nbsp;|&nbsp; krojacnica</div>
  </div>
  <div id="clock">--:--:--</div>
</div>
<script>
(function satLoop(){
  var el=document.getElementById('clock');
  if(el){var n=new Date(),p=function(x){return String(x).padStart(2,'0')};
    el.textContent=p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());}
  setTimeout(satLoop,1000);
})();
</script>

<div id="nav">
  <span class="nl">Dan:</span>
  <div id="dbs"></div>
  <div class="sep"></div>
  <!-- .tst = samo u TEST REZIMU (atributi_sistema.csv: test_precice), vidi init -->
  <div class="ci tst">
    <span class="cl">Plan. vreme</span>
    <span class="cv" id="ptv">—</span>
  </div>
  <div class="ci">
    <span class="cl">Datum pocetka (opciono)</span>
    <input type="datetime-local" id="di">
  </div>
  <div class="nav-br"></div>
  <span class="tst" style="display:contents">
  <span class="nl">Sim:</span>
  <button class="db" onclick="stepNow(1)">+1</button>
  <button class="db" onclick="stepNow(2)">+2</button>
  <button class="db" onclick="stepNow(10)">+10</button>
  <input type="number" id="nowinp" min="0" step="1" style="width:62px" placeholder="min">
  <button class="db" onclick="setNowExact()">Postavi</button>
  <button class="db" onclick="resetNow()">&#10227; 0</button>
  <div class="sep"></div>
  </span>
  <button class="db" id="mvBtn" onclick="toggleMove()" title="Prevuci operaciju mišem na novo vreme (i/ili drugo RM). Tehnoloske veze ostaju; propagira na povezane i druge proizvode trazenjem slobodnog kapaciteta.">&#9995; Premesti operaciju</button>
  <button class="db" id="mvResetBtn" onclick="resetMoves()" title="Ponisti sva rucna pomeranja — vrati plan na prvobitno stanje">&#10227; Vrati pomeranje</button>
  <button class="db" id="primeniBtn" onclick="primeniRaspored()" style="background:#1B5E20;color:#C8E6C9" title="Upisuje TRENUTNI (eventualno rucno reorganizovan) raspored kao operativan -- Terminska karta i Radna karta ce ga koristiti. NE dira poredjeni (Fini) plan. Koristiti retko, tek posle zavrsene reorganizacije (grupna tehnologija/transport), ne kao cest prekidac.">&#10003; Primeni raspored</button>
  <div class="sep"></div>
  <button class="btn" id="fsBtn" onclick="toggleFS()" style="background:#37474F;color:#90CAF9;margin-left:4px" title="Sakriva zaglavlje — ceo ekran za Gantt izabranog dana (Esc za izlaz)">⛶ Puni ekran</button>
</div>

<!-- Tabla menadzera: kojim RM period pocinje NEDOVRSENIM operacijama iz proslog
     perioda (prelaz ih markira 'nastavak') — novi (narocito push) proizvodi se
     propagacijom guraju IZA njih. Popunjava initNastavakBar(), vidljiv samo kad
     prenetih ima. -->
<div id="nastavakBar" style="display:none;background:#FFF3E0;border-bottom:2px solid #FB8C00;color:#4E342E;padding:5px 14px;font-size:12px;line-height:1.6"></div>

<div id="main">
  <div id="lp">
    <div id="lt">Fini plan — ceo period</div>
    <div id="sw"><div id="sg"></div></div>
  </div>
  <div id="rp">
    <div id="rt">
      <span>Pretpodela rada — operacije izabranog dana</span>
      <span id="si">—</span>
    </div>
    <div id="pm">
      <div id="pw"><div id="pg"></div><div id="mvGhost"></div></div>
    </div>
  </div>
</div>

<div id="toast"><span id="toast-msg"></span><button id="toast-x" onclick="closeToast()">&#10005;</button></div>

// u CELOSTI LEVO od postavljenog sata (korisnikov zahtev, 2026-09-25) -- do sada su
// se te operacije samo vizuelno bojile sivo (me<=now u pretLayout), bez ikakvog T u RK.
// Vremena su PLANSKA (T1=planski pocetak, T5=planski kraj, na osi sata plan_start+min),
// ne 'sada' -- tako se pretpostavlja da je sve levo teklo TACNO po planu (bez kasnjenja,
// pa ne uvodi propagaciju). NE dira operaciju koja tek TRAJE preko sata (T1 bez T5 je
// upravo stanje koje izaziva neocekivano produzenje, vidi toggleDoneP) niti operaciju
// koja VEC ima T5 (rucno/iz RK). Automatski upisano se pamti (LS+'_autoT') pa 'Postavi'
// na ranije vreme VRACA samo to (ne dira rucno unete T). Koraci sata (+1/+2/+10) namerno
// NE upisuju nista -- inace bi se ugasilo testiranje kasnjenja (operacija bez T5 posle
// svog kraja je bas ono sto pokrece propagaciju).
function setTPat(t,ph,ms){
    localStorage.setItem(rkKeyP(t,ph), new Date(ms).toISOString());
    if(ph===5) localStorage.setItem(doneKey(t),'1');
}
function postaviAutoT(m){
    if(!TEST_PRECICE) return;
    const AKEY=LS+'_autoT';
    let auto={}; try{ auto=JSON.parse(localStorage.getItem(AKEY)||'{}')||{}; }catch(e){ auto={}; }
    const psr=localStorage.getItem(LS);
    const psMs=psr?new Date(psr).getTime():Date.now();
    const nov={};
    PD.termini.forEach(t=>{
        if(blokiranoNastavkom(t)) return;   // nastavak iz proslog perioda -- isto kao klik, ne dira se
        const k=t.pid+'|'+t.rm+'|'+t.pocetak;
        const p=effPos(t);
        const levo = m>0 && p.e<=m;
        const staro = auto[k];
        if(staro && !levo){                 // ranije automatski upisano, sad je desno od sata -> vrati
            clearTP(t,5); if(staro.t1) clearTP(t,1);
            return;
        }
        if(!levo) return;
        if(staro){ nov[k]=staro; return; }  // vec automatski upisano i jos je levo -- zadrzi
        if(hasT5P(t)) return;               // vec ima T5 (rucno/iz RK) -- ne dira se
        const imaT1=hasT1P(t);
        if(!imaT1) setTPat(t,1,psMs+p.s*60000);
        setTPat(t,5,psMs+p.e*60000);
        nov[k]={t1:!imaT1};
    });
    localStorage.setItem(AKEY, JSON.stringify(nov));
    publishPretIzvrsenje();
    tick();
}

function ensAudio(){
    if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
}
function tone(f,d,v){
    try{
        if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
        const play=()=>{
            try{
                const o=audioCtx.createOscillator(),g=audioCtx.createGain();
                o.connect(g);g.connect(audioCtx.destination);
                o.type='sine';o.frequency.value=f;
                g.gain.setValueAtTime(v||.35,audioCtx.currentTime);
                g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);
                o.start();o.stop(audioCtx.currentTime+d);
            }catch(e){}
        };
        if(audioCtx.state==='suspended') audioCtx.resume().then(play);
        else play();
    }catch(e){}
}

// ── Pauze: clock-mapiranje (plan-min → realne minute sa pauzama) + senke ────
// Operacija koja pređe prag pauze dobija duzi clock-interval (CX(kraj)−CX(poc)).
const PAUZE = (PD.pauze||[]);   // [{pocetak_min,trajanje,tip}] plan-min, sortirano
function clockMin(pm){ let o=0; for(const p of PAUZE){ if(p.pocetak_min<pm) o+=p.trajanje; else break; } return pm+o; }
function clockToPlan(cx){ let o=0; for(const p of PAUZE){ const cs=p.pocetak_min+o;
    if(cs+p.trajanje<=cx) o+=p.trajanje; else if(cs<cx) return p.pocetak_min; else break; } return cx-o; }
function pauzeShapes(ws,we,y0,y1){ const out=[]; for(const p of PAUZE){
    if(p.pocetak_min<ws||p.pocetak_min>=we) continue; const cx=clockMin(p.pocetak_min);
    const lunch=(p.tip==='rucak');
    // RUCAK (NIJE radno vreme): neproziran prekid — operacija se VIZUELNO deli i nastavlja
    //   posle pauze (obojeni deo = stvarno trajanje, NE produzava se).
    // ODMOR (deo 480 min): providna senka — operacija se proteze (produzava) preko nje.
    out.push({type:'rect',x0:cx,x1:cx+p.trajanje,y0,y1,
        fillcolor: lunch ? 'rgba(255,243,224,1)' : 'rgba(96,125,139,0.28)',
        line: lunch ? {color:'#FB8C00',width:1.2,dash:'dot'} : {width:0},
        layer:'above'}); } return out; }
const CX = clockMin;

// ════ RUCNO PREMESTANJE OPERACIJA (drag) — uskladjivanje pretpodele ═════════
// Pretpodela je staticki plan na nivou dana; ovde se plan uskladjuje sa
// novonastalim uslovima u proizvodnji: operacija se prevlaci na novo vreme
// (i/ili drugo RM). Tehnoloske veze ostaju; pomeranje = trazenje slobodnog
// kapaciteta uz postovanje tehnologije, pa se preraspodeljuju i tehnoloski
// povezane operacije i operacije DRUGIH proizvoda.
// Pin: localStorage 'mv_<od>_<pid>_<rm>_<pocetak>' = {start, rm}. Identitet je
// PLANSKI (pid,rm,pocetak); start/rm su zeljena nova pozicija. Isti kljuc cita
// i Podela rada na RM (prikaz pomeraja).
function doneKey(t){ return 'done_'+ODP+'_'+t.pid+'_'+t.rm+'_'+t.pocetak; }
function isDone(t){ return localStorage.getItem(doneKey(t))==='1'; }
// Toast (2026-08-27, korisnikov nalaz -- isti popravljen u Podeli rada na RM,
// ovde ostao neispravljen "brat blizanac"): ranije se sam gasio (setTimeout),
// lako promakne. Sad ostaje dok se rucno ne zatvori (X); nova poruka se DODAJE
// ako je toast vec otvoren, ne gasi prethodnu.
function showToast(msg){
    const toast=document.getElementById('toast'), m=document.getElementById('toast-msg');
    if(!toast||!m) return;
    m.innerHTML = (toast.style.display==='block' && m.innerHTML) ? m.innerHTML+' &nbsp;|&nbsp; '+msg : msg;
    toast.style.display='block';
}
function closeToast(){
    const toast=document.getElementById('toast'), m=document.getElementById('toast-msg');
    if(toast) toast.style.display='none';
    if(m) m.innerHTML='';
}
// Prikazna oznaka (RN/proizvod/detalj) — SAMO za tekst koji korisnik cita, NIKAD
// za localStorage kljuceve/identitet (t.pid ostaje kljuc svuda drugde).
function ozn(t){ const b=t.pid+(t.detalj?'/'+t.detalj:''); return t.RN?(t.RN+'/'+b):b; }
// Konvencija 1 ("LET b=0") mora da se OCUVA duz tehnoloske zavisnosti: ako
// operacija zavisi (zavisnost_operacija) od JOS NEZAVRSENOG nastavka (Pravilo 1),
// njen sopstveni pocetak je JEDNAKO neizvestan -- prikazivanje na fiksnoj poznatoj
// poziciji bi "legalizovalo" pretpostavku isto kao i prikaz same prethodnice.
// (korisnikov zahtev, 2026-08-24: tehnoloska povezanost iz proslog perioda mora
// ostati ocuvana i kroz nastavak u narednom.) Memoizovano po referenci termina
// (Map, ne po pid+op stringu) -- dovoljno za jedan render prolaz kroz PD.termini.
// POJEDNOSTAVLJENO (korisnikova odluka, 2026-08-25): Konvencija 2 ukinuta --
// vazi SAMO Konvencija 1. Svaka nastavak operacija (zapoceta ili ne) se
// sakriva/tretira kao nepoznato trajanje ("LET b=0"); gornji spisak
// nezavrsenih operacija + trepercuce RM ostaju jedini vidljivi trag. Redosled
// detalja nasledjen iz proslog perioda NIJE vise ugradjeno pravilo -- da li
// ga menadzer zadrzava ili menja preko "Premesti operaciju" je NJEGOVA odluka.
function blokiranoNastavkom(t){ return !!t.nastavak; }
function mvKey(t){ return 'mv_'+ODP+'_'+t.pid+'_'+t.rm+'_'+t.pocetak; }
function getMove(t){ try{ const r=localStorage.getItem(mvKey(t)); return r?JSON.parse(r):null; }catch(e){ return null; } }
function setMove(t,start,rm){ localStorage.setItem(mvKey(t),JSON.stringify({start:Math.round(start),rm:rm||null})); }
function clearMoves(){ Object.keys(localStorage).filter(k=>k.indexOf('mv_'+ODP+'_')===0).forEach(k=>localStorage.removeItem(k)); }

// ── Test-precica: T1/T5 direktno iz Pretpodele rada (korisnikov zahtev, 2026-08-22) ──
// Da bi se pravila 1/2 (nastavak sa/bez T1) uopste mogla testirati BEZ rucnog
// prolaska kroz Radnu kartu (5 klikova T1..T5 po operaciji), klik na blok ovde
// upisuje STVARAN T1+T5 -- ISTI 'rk_' kljuc format kao Podela rada na RM
// (rkBase/tKey), da su oba prikaza usaglasena (jedan izvor istine, ne dva
// odvojena mehanizma koja bi mogla da se raziđu).
function rkKeyP(t,ph){ return 'rk_'+ODP+'_'+t.rm+'_'+t.pid+'_'+t.pocetak+'_t'+ph; }
function getTP(t,ph){ return localStorage.getItem(rkKeyP(t,ph)); }
function hasT1P(t){ return !!getTP(t,1); }
function hasT5P(t){ return !!getTP(t,5); }
function setTP(t,ph){
    localStorage.setItem(rkKeyP(t,ph), new Date(tNow()).toISOString());
    if(ph===5) localStorage.setItem(doneKey(t),'1');   // isti done_ kljuc koji isDone() cita
}
function clearTP(t,ph){
    localStorage.removeItem(rkKeyP(t,ph));
    if(ph===5) localStorage.removeItem(doneKey(t));
}
let _lastToggleP=0;
function toggleDoneP(t){
    if(!TEST_PRECICE) return;   // test-prečica ugašena (atributi_sistema.csv: test_precice,ne)
    // Zastita od brzog uzastopnog klika (korisnikov nalaz, 2026-08-22: 2-3 klika
    // u kratkom razmaku moglo je da ostavi T1 upisan bez T5) -- Date.now() je
    // stvaran (ne simulisan) sat, jer branimo od stvarnog dvostrukog klika misa,
    // ne od simulisanog vremena.
    const sada=Date.now();
    if(sada-_lastToggleP<400) return;
    _lastToggleP=sada;
    // Vec zavrsena (ima T5) -> pun test-reset (brise i T1 i T5). Inace: ako
    // nema T1, upisuje i T1 i T5 (jedan klik = "cela operacija se upravo
    // odigrala"); ako T1 vec postoji (npr. iz Radne karte), dopisuje samo T5.
    const bilaZavrsena=hasT5P(t);
    if(bilaZavrsena){ clearTP(t,5); clearTP(t,1); }
    else { if(!hasT1P(t)) setTP(t,1); setTP(t,5); }
    // Provera posle upisa (korisnikov zahtev, 2026-08-22): pokusaj da postavi
    // OBA (T1+T5) mora i da uspe u oba -- tiho nepotpuno stanje (npr. T1 bez
    // T5) je tacno ono sto izaziva neocekivanu propagaciju/produzenje trajanja
    // kroz computeMoved (LET b=0 mehanizam). Umesto da to ostane neprimeceno
    // do sledeceg prelaska perioda, upozorenje trazi ponavljanje klika ODMAH.
    if(!bilaZavrsena && !(hasT1P(t) && hasT5P(t)))
        showToast('⚠ '+ozn(t)+' '+t.operacija+' — T1/T5 nije potpuno registrovano, ponovi klik');
    publishPretIzvrsenje();
    tick();
}
// Salje KOMPLETNU sliku (svi PD.termini, ne samo kliknutu operaciju) na server --
// _zapis_izvrsenje radi PLITAK merge po proizvodu (postojece.update(izvrsenje)),
// pa bi slanje SAMO jedne operacije obrisalo vec upisane sestrinske operacije
// ISTOG proizvoda. Zove se posle svakog klika, uvek iz trenutnog (svezeg)
// localStorage stanja -- bezbedno bez obzira odakle je koja operacija oznacena.
function publishPretIzvrsenje(){
    const izvrsenje={};
    PD.termini.forEach(t=>{
        const unos=izvrsenje[t.pid]||(izvrsenje[t.pid]={efektivni_kraj:0,operacije:{}});
        if(t.kraj>unos.efektivni_kraj) unos.efektivni_kraj=t.kraj;
        unos.operacije[t.pocetak]={done:hasT5P(t), t1:hasT1P(t), kraj:t.kraj};
    });
    izvrsenje._period=PD.period||1;
    fetch('/_izvrsenje',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({odeljenje:PD.odeljenje, izvrsenje})}).catch(()=>{});
}
// Hit-test za klik-na-blok (isti obrazac kao mvHit, ali BEZ isDone() izuzetka --
// vec-zavrsena operacija mora ostati klikabilna da bi se mogla test-resetovati).
function doneHit(x,rmName){
    return PD.termini.find(t=>{ const c=curClock(t); return c.rm===rmName && x>=c.s-1 && x<=c.e+1; });
}

// List-scheduler sa pinovima (topoloski, vidi REDIZAJN ispod): zeljeni start
// = prioritet medju ZAV-spremnim operacijama; RM-serijalizacija se GRADI iz
// ZAV-redosleda, ne obrnuto. Vraca Map t -> {start,end,delta,pinned,rm}.
// Racuna se UVEK (i bez pinova) — Tpz-konsolidacija vazi i na "sirovom"
// Fini-planu, ne samo posle rucnog pomeranja.
let lastMoved=null;
let lastTpzStat=null;   // {baked,correct} — za prikaz ustede u #si (vidi tick()).
let lastNovoPrekoraceno=null;  // termini koje ZIVI preracun gura preko kap-a, a
                                // ZVANICNI plan ih tamo NIJE imao (vidi computeMoved).
// ════ TPZ KONSOLIDACIJA ═════════════════════════════════════════════════════
// Svaki termin nosi 'tpz' (pripremno-zavrsno vreme te operacije/partije) vec
// ugradjeno u sopstveno trajanje (Fini plan ga bezuslovno dodaje po partiji —
// vidi _blok() u Python delu). Kad dva ili vise uzastopnih termina ISTOG
// (maticnog) proizvoda rade na istom RM bez prekida, fizicki je potrebno samo
// JEDNO pripremanje — ovde se visak uklanja/vraca u zavisnosti od stvarnog
// (zeljenog/pomerenog) redosleda, i za spojene partije (pa/pb unutar np) i za
// odvojene termine istog maticnog proizvoda (npr. A1.1/A1.2 iz V2 dekompozicije,
// vidi dekomponuj_partije: `out[f"{pid}.{k+1}"] = ...` -- SUFIKS na KRAJU
// citavog originalnog pid-a, ne prefiks pre prve tacke).
//
// BAG ispravljen 2026-08-16 (korisnikov nalaz, zivo testiranje): `split('.')[0]`
// je pretpostavljao da maticni pid NEMA tacaka -- tacno za proste pid-ove
// ("A1" -> V2 "A1.1"/"A1.2"), ali POGRESNO cim pid VEC sadrzi tacke iz DRUGOG
// razloga (npr. "Stolica/STL.d3.KRO" -- detalj/odeljenje kod razdvojeni
// tackama u imenu). Tada je split('.')[0] vracao SAMO "Stolica/STL" za SVAKI
// detalj (d1..d5) istog proizvoda, lazno ih tretirajuci kao partije ISTE
// serije -- Tpz se "ustedeo" izmedju POTPUNO RAZLICITIH detalja/operacija,
// iako svaki nosi SOPSTVENU, nezavisno unetu Tpz vrednost u CSV-u (dokaz da
// fizicki NE dele pripremu -- korisnikov argument, video ga u stanje_plana.json
// gde iste 'O5' operacije razlicitih detalja imaju RAZLICIT Tpz).
//
// Ispravka: umesto "sve pre PRVE tacke", skida se SAMO brojcani sufiks NA
// KRAJU (ako postoji) -- tacno ono sto dekomponuj_partije stvarno dodaje, bez
// obzira koliko tacaka maticni pid vec ima. Za proizvoljan V1 pid (nikad ne
// dobija taj sufiks) ovo NISTA ne menja (regex ne pogadja), pa se svaki
// detalj tretira kao sopstvena, nezavisna serija -- tacno kako CSV (odvojena
// Tpz kolona po redu) i nalaze.
const _par = t => String(t.pid).replace(/\.\d+$/, '');
// Porodica + TIP operacije -- za Tpz-run (lastParOnRm/fir) u computeMoved.
// Sam _par (porodica) NIJE dovoljan kod 'radno_mesto' override-a (univerzalne
// masine, npr. rendisaljka-ravnalica gde se na isto vreteno postavlja glava
// za busenje ili glodalo): dve partije ISTE porodice na ISTOM RM i dalje
// zahtevaju POSEBAN Tpz ako je jedna Ravnanje a druga Busenje/Glodanje --
// isti uslov kao backend _dopunska_konsolidacija_tpz (op_cur['operacija']!=
// op_prev['operacija']), korisnikov primer 2026-09-10.
const _parOp = t => _par(t) + '|' + (t.operacija||'');
const _brOf = t => (t.pb!==undefined && t.pa!==undefined) ? (t.pb-t.pa+1) : 1;
// 'tpz_konsolidovan' (backend, _dopunska_konsolidacija_tpz) -- ako je vec
// konsolidovano, NISTA od t.tpz nije ugradjeno u (t.kraj-t.pocetak), jer
// backend menja SAMO 'kraj' i 'tpz_konsolidovan', nikad samo polje op['tpz']
// (ono mora ostati puna nominalna vrednost -- koristi ga i ovaj isti
// racun za "fir" granu ispod). RANIJE (do 2026-09-10) ova funkcija je UVEK
// vracala puni t.tpz, sto je pre uvodjenja backend-konsolidacije bilo tacno
// (t.kraj-t.pocetak je tada UVEK sadrzao pun Tpz) -- korisnikov nalaz
// 2026-09-10: posle backend-konsolidacije to vise ne vazi, pa je "Premesti
// operaciju" (computeMoved) dvostruko oduzimao Tpz kad sused ostane isti
// (fir=false) ili ga sasvim izgubio kad se sused ukloni pomeranjem (fir=true).
const _bakedTpz = t => t.tpz_konsolidovan ? 0 : _brOf(t)*(t.tpz||0);

// ════ REDIZAJN 2026-08-16 (korisnikov zahtev, opsti algoritam koji UVEK
// konvergira) ═══════════════════════════════════════════════════════════════
// Stari pristup je RM-redosled na svakom RM racunao JEDNOM, unapred, prostim
// sortiranjem po zeljenom pocetku (desS) — pa je taj FIKSNI redosled pokusavao
// da izmiri sa zavisnost_operacija (ZAV) preko iterativne relaksacije
// (fixpoint). Ako su ta dva NEZAVISNO fiksirana redosleda kontradiktorna
// (RM kaze "A pre B", ZAV kaze "B pre A" — moguce cim vise proizvoda deli
// iste RM, vidi [[dijamant_ciklus_fiksan_redosled]]), fixpoint NIKAD ne
// konvergira ("Premesti operaciju" razvuce x-osu unedogled).
//
// KORISNIKOVO RAZJASNJENJE (2026-08-16), presudno za ispravku: zavisnost_
// operacija je DATA tehnoloska cinjenica (tehnologija) — RM-redosled je
// ODLUKA raspoređivanja (upravljanje). To su DVE RAZLICITE VRSTE ogranicenja,
// ne dva ravnopravna izvora istine koje treba "izmiriti" — RM-redosled MORA
// da postuje ZAV, nikad obrnuto.
//
// Ispravka: listа-raspoređivanje po topoloskom redosledu (Kan-ov algoritam).
// Operacija ULAZI u RM red TEK kad su joj SVE ZAV-prethodnice (isti pid) VEC
// rasporedjene — RM-redosled se tako GRADI iz vec zadovoljenog ZAV-redosleda,
// nikad obrnuto, pa kontradikcija postaje STRUKTURNO nemoguca (ne samo manje
// verovatna). Ovo je JEDAN prolaz (ne iterativna relaksacija) — garantovano
// se zavrsava u najvise onoliko koraka koliko ima termina. Ako sam ZAV graf
// (tehnoloski unet, ne RM-indukovan) ima ciklus — to je STVARNA tehnoloska
// greska u unosu (npr. "A ceka B, B ceka A"), ne nesto sto bilo koji
// raspoređivac moze da resi — prijavljuje se jasno (toast), ne tiho ignorise.
function computeMoved(){
    const pins=new Map();
    PD.termini.forEach(t=>{ const o=getMove(t); if(o) pins.set(t,o); });

    // NEMA NIJEDNOG rucnog pomeranja -- zivi prikaz MORA da pokaze TACNO ono
    // sto je izracunato, ne svoju nezavisnu Kahn-rekonstrukciju (korisnikova
    // odluka 2026-09-14: "mora da se nadje resenje koje ce ono sto je
    // izracunato i da ga prikaze" -- vizuelni prikaz je CEO smisao alata,
    // sme da SLIKA zvanicni plan, nikad da racuna sopstveni, potencijalno
    // drugaciji odgovor). Puna rekonstrukcija ispod ostaje NEOPHODNA samo kad
    // POSTOJI bar jedno rucno pomeranje -- tad SE MORA videti niz-vodni efekat
    // tog pomeranja, sto zvanicni (nepromenjeni) plan po definiciji ne zna.
    // 'tpz_konsolidovan' je vec zvanicna (backend) odluka -- direktno govori
    // da li je OVA operacija "prva u nizu" (placa pun Tpz) ili ne, bez ikakve
    // potrebe da se ovde ponovo otkriva.
    if(pins.size===0){
        const moved=new Map();
        PD.termini.forEach(t=>{
            moved.set(t,{start:t.pocetak, end:t.kraj, delta:0, pinned:false,
                rm:t.rm, prvi:!t.tpz_konsolidovan});
        });
        moved.hasPins=false;
        const byRmMoved={};
        moved.forEach(m=>(byRmMoved[m.rm]||(byRmMoved[m.rm]=[])).push(m.start));
        Object.values(byRmMoved).forEach(a=>a.sort((x,y)=>x-y));
        moved.nextStartOnRm=(rmName,afterT)=>{
            const arr=byRmMoved[rmName]; if(!arr) return Infinity;
            for(const s of arr) if(s>afterT+1e-6) return s;
            return Infinity;
        };
        moved.novoPrekoraceno=[];
        lastNovoPrekoraceno=[];
        lastMoved=moved;
        lastTpzStat={ baked: PD.termini.reduce((s,t)=>s+_bakedTpz(t),0),
                      correct: PD.termini.reduce((s,t)=>s+(t.tpz_konsolidovan?0:(t.tpz||0)),0) };
        return moved;
    }

    const desS=t=> pins.has(t)? pins.get(t).start : t.pocetak;
    const rmOf=t=> (pins.has(t)&&pins.get(t).rm)? pins.get(t).rm : t.rm;

    // ZAV-prethodnice po terminu (isti pid, op u t.zavisnost) — predracunato
    // JEDNOM, umesto O(n) skena po terminu (kao pre u reqChain()). Token u
    // t.zavisnost koji NIJE sopstveni op-id (P.pid===t.pid) moze biti
    // KROS-PROIZVODNA referenca -- direktan naziv DRUGOG proizvoda (npr. C1
    // "A1,B1", korisnikova eksplicitna odluka 2026-09-10, vidi Python
    // _razdvoji_zavisnost) -- tad se preko _par() (vec postojeci helper)
    // dodaju SVE operacije referenciranog proizvoda kao prethodnice; depDone
    // dole vec uzima Math.max(...) nad svim prethodnicama, pa to automatski
    // znaci "sacekaj CEO proizvod", bez ikakve druge izmene Kahn-a.
    const zavPreds=new Map(), succOf=new Map();
    PD.termini.forEach(t=>succOf.set(t,[]));
    PD.termini.forEach(t=>{
        const pr=t.zavisnost||[];
        const preds=pr.length? PD.termini.filter(P=>
            (P.pid===t.pid && pr.includes(P.op)) ||
            (P.pid!==t.pid && pr.includes(_par(P)))
        ) : [];
        zavPreds.set(t,preds);
        preds.forEach(P=>succOf.get(P).push(t));
    });

    // Sledbenici (tranzitivno, isti ZAV-lanac) SVAKOG rucno pinovanog termina --
    // kad menadzer pomeri operaciju RANIJE, njeni tehnoloski sledbenici moraju
    // da je prate, ne da ostanu na staroj poziciji (korisnikov zahtev
    // 2026-09-16, zivo testiranje: 'Premesti operaciju' iz dana 7 nazad u P1 je
    // pomerio SAMO oznaceni blok, ostatak lanca -- npr. O4/O5/O1/O2 istog
    // proizvoda -- je ostao u danu 7). Sami PINOVI su izuzeti iz ovog skupa --
    // njihov desS() JE korisnikova namerna odluka, ostaje tvrd pod istim
    // pravilima kao do sada.
    const povuceno=new Set();
    {
        const stek=[...pins.keys()];
        while(stek.length){
            const cur=stek.pop();
            (succOf.get(cur)||[]).forEach(S=>{
                if(!pins.has(S) && !povuceno.has(S)){ povuceno.add(S); stek.push(S); }
            });
        }
    }

    const SS=new Map(), SE=new Map();
    const rmFree=new Map();          // RM -> sledeci slobodan trenutak (raste monotono)
    const lastParOnRm=new Map();     // RM -> _parOp() poslednje POSTAVLJENE stavke (za Tpz-run)
    const firstInRun=new Set();
    const indeg=new Map(); PD.termini.forEach(t=>indeg.set(t,zavPreds.get(t).length));
    let ready=PD.termini.filter(t=>indeg.get(t)===0);
    const placed=new Set();

    while(ready.length){
        // Medju SVIM trenutno spremnim (ZAV-zadovoljenim) operacijama, najmanji
        // zeljeni pocetak ide sledeci; tie-break je TEHNOLOGOV 'redosled' (ISPRAVKA
        // 2026-08-21 -- ranije trajanje, sto je dozvoljavalo da npr. O2 preskoci O3
        // iako obe zavise samo od O4 i redosled izricito trazi O3 pre O2, vidi
        // [[dijamant_ciklus_fiksan_redosled]]: redosled je JEDINI stvarni redosled
        // izvrsenja, ne nesto sto raspoređivač sme da izvede iz trajanja) — ovo je
        // JEDINA uloga desS/pin-a: prioritet medju vec-dozvoljenim opcijama, NIKAD
        // tvrdo ogranicenje koje bi moglo da se sudari sa ZAV.
        ready.sort((a,b)=>desS(a)-desS(b)||(a.redosled-b.redosled));
        const t=ready.shift();
        const rm=rmOf(t);
        const depDone=zavPreds.get(t).reduce((mx,P)=>Math.max(mx,SE.get(P)||0),0);
        if(t.nastavak){
            // Konvencija 2 (i njena dopuna) UKINUTE (korisnikova odluka,
            // 2026-08-25): SVAKA nastavak operacija (zapocela ili ne) staje u
            // red cekanja OD 0 sledeceg perioda ("LET b=0") -- nikad ne blokira
            // RM niti je RM blokira (ne cita/upisuje rmFree/lastParOnRm).
            // depDone (stvarna ZAV-zavisnost) ostaje postovana -- to je opsti
            // mehanizam topoloskog rasporedjivanja (isti za SVE operacije),
            // ne "Pravilo 2"-specificna dopuna. Stvaran radni redosled
            // (ukljucujuci eventualnu tehnolosku povezanost) je odluka
            // menadzera (Premesti operaciju), ne ugradjeno pravilo -- spisak
            // nezavrsenih operacija dobija u Pretpodeli rada narednog perioda.
            const fir=(lastParOnRm.get(rm)===undefined || lastParOnRm.get(rm)!==_parOp(t));
            if(fir) firstInRun.add(t);
            const traj=(t.kraj-t.pocetak) - _bakedTpz(t) + (fir?(t.tpz||0):0);
            // povuceno: bez sopstvene stare pozicije kao poda -- sme RANIJE
            // da prati pinovanog prethodnika (vidi 'povuceno' iznad).
            const ns=(povuceno.has(t)? depDone : Math.max(desS(t),depDone)), ne=ns+traj;
            SS.set(t,ns); SE.set(t,ne);
        } else {
            const rf=rmFree.get(rm)||0;
            // PRAZAN HOD (korisnikova odluka 2026-09-28): masina OSTAJE podesena
            // i kad izmedju dve uzastopne operacije iste porodice+tipa na ovom RM
            // postoji samo prazan hod -- 'fir' zavisi SAMO od toga da li je
            // POSLEDNJA postavljena stavka na RM ista porodica+tip (tudj rad
            // izmedju ponistava podesenost). Isto pravilo kao backend
            // _dopunska_konsolidacija_tpz i _kalkuli_tpz. Raniji uslov ns===rf
            // (opis ispod je istorijski) je posle SVAKOG rucnog pomeranja gubio
            // konsolidaciju zavrsnih operacija PULL partija u CELOM planu --
            // backend im ustedu stavlja na POCETAK (rok ostaje), pa ispred njih
            // ostaje praznina = Tpz (nalaz 2026-09-28, zavrsni test).
            // ISTORIJSKI: 'ns' se MORA znati PRE odluke o 'fir' -- konsolidacija vazi SAMO
            // ako OVA operacija stvarno pocinje TACNO gde je RM prethodno
            // postalo slobodno (ns===rf). Ako sopstveni zeljeni pocetak/ZAV-
            // zavisnost gura pocetak KASNIJE (prazan hod na masini), "prethodna"
            // stavka VISE NIJE fizicki neposredno pre nje -- isti kriterijum kao
            // backend _dopunska_konsolidacija_tpz ('p_cur != k_prev: continue').
            // BAG ispravljen (korisnikov nalaz 2026-09-11, zivo testiranje BEZ
            // ijednog rucnog pomeranja): ranije se 'fir' racunao PRE nego sto se
            // uopste znalo da li ns==rf, pa je bilo koja operacija ISTE
            // porodice+tipa kao POSLEDNJA postavljena na tom RM bila tretirana
            // kao konsolidovana i kad je izmedju njih postojala prazna praznina
            // -- tri nepovezane operacije su se "skratile" u prikazu bez ijedne
            // stvarne promene plana.
            // povuceno: isto izuzece kao gore -- rf (RM slobodan) i depDone
            // (stvarna ZAV-zavisnost) ostaju postovani, samo se ukida sopstvena
            // stara pozicija kao dodatni pod.
            const ns=(povuceno.has(t)? Math.max(depDone,rf) : Math.max(desS(t),depDone,rf));
            const fir=!(lastParOnRm.get(rm)!==undefined && lastParOnRm.get(rm)===_parOp(t));
            if(fir) firstInRun.add(t);
            const traj=(t.kraj-t.pocetak) - _bakedTpz(t) + (fir?(t.tpz||0):0);
            const ne=ns+traj;
            SS.set(t,ns); SE.set(t,ne);
            rmFree.set(rm,ne);
            lastParOnRm.set(rm,_parOp(t));
        }
        placed.add(t);
        succOf.get(t).forEach(S=>{
            indeg.set(S,indeg.get(S)-1);
            if(indeg.get(S)===0) ready.push(S);
        });
    }

    // Ciklus u SAMOM zavisnost_operacija grafu (tehnoloska greska u unosu, ne
    // RM-indukovana) -- nerasporedjenim terminima "b=0" (sopstvena, nepomerena
    // pozicija) da ostatak plana i dalje ispravno renderuje, uz jasno
    // upozorenje menadzeru KOJE operacije treba proveriti.
    const nerasporedjeno=PD.termini.filter(t=>!placed.has(t));
    if(nerasporedjeno.length){
        console.warn('[computeMoved] Kružna zavisnost_operacija za:',
            nerasporedjeno.map(t=>ozn(t)+' — '+t.operacija));
        nerasporedjeno.forEach(t=>{ SS.set(t,t.pocetak); SE.set(t,t.kraj); });
        showToast('⚠ Kružna zavisnost_operacija (tehnološka greška, proverite unos) — '+
            nerasporedjeno.map(t=>ozn(t)+' '+t.operacija).join(' | '));
    }

    const moved=new Map();
    PD.termini.forEach(t=>{ moved.set(t,{start:SS.get(t),end:SE.get(t),
        delta:Math.round(SS.get(t)-t.pocetak), pinned:pins.has(t), rm:rmOf(t),
        prvi:firstInRun.has(t)}); });
    moved.hasPins=pins.size>0;   // ima li BAR JEDNOG stvarnog rucnog pomeranja (za prikaz overlay-a)
    // Po RM sortirani sveži startovi — za "Ušteda Tpz" (vidi ustedaSeg ispod): da senka
    // ne prekrije sledeći blok koji je konsolidacijom preuzeo oslobodjeno vreme. Zavisi
    // od TRENUTNOG (moved) poretka, pa se svaki put racuna iznova zajedno sa moved —
    // rucno pomeranje menja i firstInRun i ovaj poredak, u oba smera (spajanje/razdvajanje).
    const byRmMoved={};
    moved.forEach(m=>(byRmMoved[m.rm]||(byRmMoved[m.rm]=[])).push(m.start));
    Object.values(byRmMoved).forEach(a=>a.sort((x,y)=>x-y));
    moved.nextStartOnRm=(rmName,afterT)=>{
        const arr=byRmMoved[rmName]; if(!arr) return Infinity;
        for(const s of arr) if(s>afterT+1e-6) return s;
        return Infinity;
    };
    // NOVO prekoracenje kraja perioda -- UVEDENO ovim zivim preracunom, nije
    // postojalo u ZVANICNOM (batch) planu (t.kraj<=kap tamo, ali m.end>kap
    // ovde). Korisnikova odluka 2026-09-14: tiho prihvatanje ovoga bi bilo
    // isto sto i prihvatanje prekoracenja BEZ svesne odluke menadzera
    // (pregovori su od 2026-09-28 na Grubom planu; Fino u akcija_dodaj_nove
    // prekoracenje samo belezi kao 'prekoracenje_bez_alternative_1').
    // computeMoved() ne pregovara (nije njegov posao, samo prikazuje) -- ali
    // MORA glasno da prijavi, isti obrazac kao kruzna-zavisnost upozorenje
    // iznad.
    const novoPrekoraceno=[];
    PD.termini.forEach(t=>{
        const m=moved.get(t);
        if(m.end>PD.kapacitet+1e-6 && t.kraj<=PD.kapacitet+1e-6) novoPrekoraceno.push(t);
    });
    // Toast SAMO za NOVO nastale stavke (nisu bile u prethodnom prolazu) --
    // computeMoved() se zove na SVAKI tick, pa bi bez ovoga ista poruka
    // beskonacno ponavljala/rasla dok god uslov traje (korisnikov nalaz
    // 2026-09-16: "dijagnostika stalno treperi, bez mogucnosti brisanja").
    // Trajni statusni transparent (linija 6045 i dalje) i dalje ispravno
    // prikazuje TRENUTAN broj/stanje na svaki tick -- samo se PROLAZNA
    // notifikacija ne ponavlja za vec poznato stanje.
    const vecPoznato=new Set(lastNovoPrekoraceno||[]);
    const novoOvogPuta=novoPrekoraceno.filter(t=>!vecPoznato.has(t));
    if(novoOvogPuta.length){
        console.warn('[computeMoved] Novo prekoracenje perioda (NIJE u zvanicnom planu):',
            novoOvogPuta.map(t=>ozn(t)+' — '+t.operacija+': '+Math.round(moved.get(t).end)+'min'));
        showToast('⚠ Živi raspored gura van perioda (kap='+PD.kapacitet+'min) — zvanični plan TO NEMA — '+
            novoOvogPuta.map(t=>ozn(t)+' '+t.operacija+' → '+Math.round(moved.get(t).end)+'min').join(' | '));
    }
    lastNovoPrekoraceno=novoPrekoraceno;

    lastMoved=moved;
    lastTpzStat={ baked: PD.termini.reduce((s,t)=>s+_bakedTpz(t),0),
                  correct: PD.termini.reduce((s,t)=>s+(firstInRun.has(t)?(t.tpz||0):0),0) };
    return moved;
}
// Ušteda Tpz segment za termin t: praznina izmedju korigovanog kraja (mv.end) i
// izvornog Fini-plan kraja (t.kraj), nastala konsolidacijom pripremno-zavrsnog
// vremena, ogranicena onim sto NIJE vec preuzeo sledeci blok na istom RM. Deljeno
// izmedju pretLayout() (crtanje senke) i buildPretTraces() (hover) — ISTI kriterijum,
// da hover i vizuelni prikaz uvek budu usaglaseni.
function ustedaSeg(t, moved){
    const mv=moved.get(t); if(!mv) return null;
    const usteda=t.kraj-mv.end;
    if(usteda<=0.5) return null;
    const hEnd=Math.min(t.kraj, moved.nextStartOnRm(mv.rm, mv.end));
    const hw=hEnd-mv.end;
    if(hw<=0.5) return null;
    return {hs:mv.end, he:hEnd, hw, rm:mv.rm};
}
// Da li je termin VIDLJIVO promenjen (pomeren i/ili skraceno/produzeno trajanje
// usled Tpz-konsolidacije) — pokriva i cist duration-delta bez pomeraja starta.
function _mvChanged(t,mv){
    if(!mv) return false;
    if(mv.pinned || Math.abs(mv.delta)>=1) return true;
    return Math.abs((mv.end-mv.start)-(t.kraj-t.pocetak))>=1;
}
// Efektivna pozicija operacije (posle Tpz-konsolidacije i eventualnog rucnog pomeranja) —
// za panel/signale. UVEK korigovana pozicija (ne samo kad ima pinova) — signali i 5-min
// zona moraju da prate stvarno (konsolidovano) vreme, ne "sirovo" iz Finog plana.
function effPos(t){
    const mv=lastMoved&&lastMoved.get(t);
    if(mv) return {s:mv.start,e:mv.end,rm:mv.rm};
    return {s:t.pocetak,e:t.kraj,rm:t.rm};
}

// "Primeni raspored" (korisnikova odluka 2026-09-11) -- EKSPLICITNA, RETKA
// potvrda da trenutni (eventualno rucno reorganizovan) raspored postaje
// OPERATIVAN za Terminsku kartu i RK -- grupna tehnologija (smanjenje Tpz) i
// izravnavanje transporta inace nemaju stvaran efekat, samo se vide u ovom
// prozoru. NIKAD ne dira stanje_plana.json (reper ostaje netaknut,
// [[pocetni_plan_reper_bez_writeback]]) -- pise SAMO poseban fajl na serveru.
// Namerno BEZ auto-primene/live-toggle karaktera -- korisnikov zahtev da ovo
// ne postane mesto za cesto menjanje odluke.
function primeniRaspored(){
    if(!lastMoved){ showToast('⚠ Nema izracunatog rasporeda za primenu.'); return; }
    const items={};
    lastMoved.forEach((mv,t)=>{ items[t.pid+'|'+t.rm+'|'+t.pocetak]={s:mv.start,e:mv.end,rm:mv.rm,tpz:!mv.prvi}; });
    const n=Object.keys(items).length;
    if(!confirm('Primeniti trenutni raspored ('+n+' operacija) kao OPERATIVAN za '+
                'Terminsku kartu i Radnu kartu?\n\nOvo NE menja pocetni (Fini) plan -- '+
                'samo daje stvaran efekat vasoj reorganizaciji. Koristite retko, tek '+
                'posle zavrsene reorganizacije.')) return;
    fetch('/_primeni_raspored', {method:'POST', body:JSON.stringify({
        odeljenje: PD.odeljenje, period: PD.period, generacija: PD.generacija, items
    })}).then(r=>r.text()).then(t=>{
        if(t==='ok') showToast('✓ Raspored primenjen ('+n+' operacija) — Terminska karta, RK i Podela su automatski osveženi (otvorite/osvežite ih da vidite).');
        else if(t==='stale') showToast('⚠ Plan je zastareo (period/generacija se promenila) — osvezite stranicu.');
        else showToast('⚠ Neocekivan odgovor servera.');
    }).catch(()=>showToast('⚠ Primena nije uspela (server nedostupan?).'));
}
// Robusna piksel<->podatak konverzija (linearne ose) preko _offset/_length/range.
function pixelToData(e){
    const gd=document.getElementById('pg'); if(!gd||!gd._fullLayout) return null;
    const xa=gd._fullLayout.xaxis, ya=gd._fullLayout.yaxis, r=gd.getBoundingClientRect();
    if(!xa._length||!ya._length) return null;
    const xf=(e.clientX-r.left-xa._offset)/xa._length, yf=(e.clientY-r.top-ya._offset)/ya._length;
    return { x: xa.range[0]+xf*(xa.range[1]-xa.range[0]),
             y: ya.range[1]-yf*(ya.range[1]-ya.range[0]) };   // Y invertovan (pikseli rastu nadole)
}
function dataToPixel(xv,yv){
    const gd=document.getElementById('pg'); if(!gd||!gd._fullLayout) return null;
    const xa=gd._fullLayout.xaxis, ya=gd._fullLayout.yaxis;
    const xp=(xv-xa.range[0])/(xa.range[1]-xa.range[0])*xa._length+xa._offset;
    const yp=(ya.range[1]-yv)/(ya.range[1]-ya.range[0])*ya._length+ya._offset;  // Y invertovan
    return {xp,yp};
}
// trenutna (mozda pomerena) pozicija u clock-prostoru — za hit-test
function curClock(t){ const mv=lastMoved&&lastMoved.get(t);
    return mv? {s:CX(mv.start),e:CX(mv.end),rm:mv.rm} : {s:CX(t.pocetak),e:CX(t.kraj),rm:t.rm}; }
function mvHit(x,rmName){
    // Kad se dva termina RAZLICITIH proizvoda slucajno preklope na istom RM/
    // vremenu, pretLayout() ih crta PO REDOSLEDU iz PD.termini -- kasniji u
    // nizu se vizuelno crta PREKO ranijeg (isti Plotly shapes-poredak). Klik
    // mora da pogodi TAJ, vizuelno "na vrhu" termin, ne proizvoljno prvi
    // poklapajuci (korisnikov nalaz 2026-09-16: klik je slucajno hvatao tudj,
    // preklopljen termin umesto onog koji se vidi). Trazi se OD KRAJA niza.
    for(let i=PD.termini.length-1;i>=0;i--){
        const t=PD.termini[i], c=curClock(t);
        if(c.rm===rmName && !isDone(t) && x>=c.s-1 && x<=c.e+1) return t;
    }
    return undefined;
}
function showGhost(t){ const g=document.getElementById('mvGhost'); if(!g) return;
    g.style.display='flex'; g.textContent=ozn(t)+' '+t.operacija; }
function moveGhost(e){
    const g=document.getElementById('mvGhost'); if(!g||!mvDrag) return;
    const d=pixelToData(e); if(!d) return;
    // Red (RM) je ZAKLJUCAN na sopstveni red operacije (vidi mouseup ispod) --
    // duh prati SAMO horizontalno pomeranje, da ne sugerise da je moguce
    // "ispustiti" na drugo radno mesto.
    const startClock=d.x-mvDrag.grabDx, yi=mvDrag.yi;
    const p0=dataToPixel(startClock,yi+0.37), p1=dataToPixel(startClock+mvDrag.w,yi-0.37);
    if(!p0||!p1) return;
    g.style.left=p0.xp+'px'; g.style.top=p1.yp+'px';
    g.style.width=Math.max(18,p1.xp-p0.xp)+'px'; g.style.height=Math.max(14,p0.yp-p1.yp)+'px';
}
function hideGhost(){ const g=document.getElementById('mvGhost'); if(g) g.style.display='none'; }
function mvAttach(){
    const gd=document.getElementById('pg'); if(!gd||gd._mvAttached) return; gd._mvAttached=true;
    gd.addEventListener('mousedown',e=>{
        if(!moveMode||e.button!==0) return;
        const d=pixelToData(e); if(!d) return;
        const rmName=PD.rm_lista[Math.round(d.y)]; if(!rmName) return;
        const t=mvHit(d.x,rmName); if(!t) return;   // promasaj bloka -> pusti Plotly pan/skrol
        e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
        const c=curClock(t);
        mvDrag={t, grabDx:d.x-c.s, w:c.e-c.s, yi:PD.rm_lista.indexOf(t.rm)};
        document.getElementById('pw').classList.add('drag');
        showGhost(t); moveGhost(e);
    },true);
    window.addEventListener('mousemove',e=>{ if(mvDrag) moveGhost(e); });
    window.addEventListener('mouseup',e=>{
        if(!mvDrag) return;
        const t=mvDrag.t, d=pixelToData(e);
        // Radno mesto na kom se operacija izvrsava je tehnoloski zadato (koje RM
        // ume/sme da je uradi), ne menadzerova odluka -- "Premesti operaciju" sme
        // da pomeri SAMO vreme, NIKAD radno mesto (korisnikova odluka, 2026-08-27;
        // ranije ogranicenje nije postojalo, moglo se ispustiti na bilo koji RM).
        const startClock = d ? (d.x-mvDrag.grabDx) : CX(t.pocetak);
        let newStart=Math.max(0,Math.round(clockToPlan(startClock)));
        // Operacija se ne moze vratiti ISPRED sata (korisnikova odluka, 2026-09-26) -- isto kao sto se ne
        // moze prebaciti na drugo RM: pomeranje je samo unapred. Ispustena ispred sata -> staje NA sat.
        const satP=nowMin();
        if(satP>0 && newStart<satP){
            newStart=Math.ceil(satP);
            showToast('Operacija ne može da počne pre sata ('+Math.round(satP)+' min) — postavljena je na sat.');
        }
        setMove(t,newStart,t.rm);
        mvDrag=null; document.getElementById('pw').classList.remove('drag'); hideGhost();
        tick();
    });
}

// Pretpodela Gantt (desno)
// Gradi hover-markere na EFEKTIVNOJ (Tpz-korigovanoj/pomerenoj) poziciji preko
// effPos() — ISTOJ koju pretLayout() vec crta. Zove se SVAKI tick (ne samo prvi
// put), jer se ta pozicija menja (npr. Tpz-konsolidacija, rucno pomeranje); u
// suprotnom bi hover pokazivao sirovu, neuskladjenu vrednost dok se blok crta
// pomeren — menadzer bi video dva razlicita broja za isti blok.
function buildPretTraces(){
    const rm={};
    PD.rm_lista.forEach((r,i)=>rm[r]=i);
    ptraces=[];
    PD.termini.forEach(t=>{
        if(!(t.rm in rm) || blokiranoNastavkom(t)) return;   // u toku (bez T5), ili tehnoloski zavisi od njega
        const p=effPos(t);
        if(!(p.rm in rm)) return;
        const trajanje=p.e-p.s;
        ptraces.push({
            x:[(CX(p.s)+CX(p.e))/2],y:[rm[p.rm]],
            mode:'markers',marker:{size:1,opacity:0},
            hovertemplate:'<b>'+ozn(t)+' — '+t.operacija+'</b><br>'+
                (t.nastavak?(t.razlog_nastavka==='potvrdjeno'?'✓ Potvrđeno prekoračenje perioda<br>':'⟳ Nastavak iz prošlog perioda<br>'):'')+
                'RM: '+p.rm+(kalRaspon(p.s,p.e)?'<br>Vreme: '+kalRaspon(p.s,p.e):'')+'<br>Plan: '+Math.round(p.s)+'–'+Math.round(p.e)+' min<br>'+
                'Trajanje: '+Math.round(trajanje)+' min'+
                (TEST_PRECICE?'<br><i>TEST-prečica: klik upisuje T1+T5 u Radnu kartu (ponovni klik ih briše)</i>':'')+
                '<extra></extra>',
            showlegend:false
        });
        // Hover za "Ušteda Tpz" senku (ista ustedaSeg() koju crta pretLayout) —
        // lastMoved je svez jer pretLayout() u tick() uvek radi PRE ovog poziva.
        const seg = lastMoved ? ustedaSeg(t, lastMoved) : null;
        if(seg && (seg.rm in rm)){
            ptraces.push({
                x:[(CX(seg.hs)+CX(seg.he))/2],y:[rm[seg.rm]],
                mode:'markers',marker:{size:1,opacity:0},
                hovertemplate:'<b>Ušteda Tpz</b><br>'+ozn(t)+' — '+t.operacija+'<br>'+
                    Math.round(seg.hw)+' min (konsolidacija pripremno-završnog vremena)<extra></extra>',
                showlegend:false
            });
        }
    });
}

function pretLayout(ws, we, now){
    const rm={};
    PD.rm_lista.forEach((r,i)=>rm[r]=i);
    const n=PD.rm_lista.length;
    const shapes=[], ann=[];

    const moved=computeMoved();        // rucna pomeranja + Tpz-konsolidacija (uvek racuna se)
    const hasPins=moved.hasPins;       // BAR JEDAN stvarni rucni pin negde u planu?
    const mvOverlay=[];

    // Kad pomeranje gura operacije udesno (i preko kraja dana), prosiri prikazani
    // opseg do najkasnije pomerene operacije — da se vidi koliko je pomeranje (skrol).
    // ISPRAVKA (2026-08-27, isti bag kao ranije nadjen u Podeli rada na RM —
    // "dan 5 je pokazivao 5,6,7..."): u obzir se uzimaju SAMO termini koji
    // STVARNO DODIRUJU izabrani dan [ws,we) na svojoj IZVORNOJ (t.pocetak/t.kraj)
    // poziciji -- bez ove provere, operacija pomerena daleko u NAREDNI dan i dalje
    // siri "danasnji" prozor da je prikaze, dok je Podela (vec ispravljena) vise
    // ne prikazuje jer stvarno ne pripada izabranom danu -- dve strane su tako
    // pokazivale razlicito stanje za istu operaciju.
    let weEff=we;
    moved.forEach((m,t)=>{
        if(t.pocetak>=we || t.kraj<=ws) return;   // ne dodiruje izabrani dan
        if(hasPins&&_mvChanged(t,m)&&m.end>weEff) weEff=m.end;
    });
    weEff=Math.ceil(weEff);

    PD.termini.forEach(t=>{
        if(!(t.rm in rm) || blokiranoNastavkom(t)) return;   // u toku (bez T5), ili tehnoloski zavisi od njega

        const y=rm[t.rm];
        const mv=moved.get(t);
        // OVERLAY (ljubicast, sa "duhom" originala) — SAMO kad negde u planu postoji
        // bar jedan stvarni rucni pin (ovaj termin je pomeren ili je posledica tudjeg
        // pomeranja). Bez ijednog pina, Tpz-konsolidacija se prikazuje kao NORMALAN
        // blok na korigovanoj (mv) poziciji — nema "duha" jer nema sta korisnik da
        // uporedi (Fini plan nikad nije prikazan kao referenca u ovom pogledu).
        if(hasPins && _mvChanged(t,mv)){
            const yo=(mv.rm in rm)?rm[mv.rm]:y;
            if((mv.end<=ws||mv.start>=weEff)&&(t.kraj<=ws||t.pocetak>=weEff)) return;
            if(!(t.kraj<=ws||t.pocetak>=weEff))
                shapes.push({type:'rect',x0:CX(t.pocetak),x1:CX(t.kraj),y0:y-.32,y1:y+.32,
                    fillcolor:PD.boje[t.pid],opacity:0.16,
                    line:{color:'#9E9E9E',width:1,dash:'dash'},layer:'above'});
            mvOverlay.push({t,mv,y:yo});
            return;
        }
        // Normalan blok — na EFEKTIVNOJ (Tpz-korigovanoj) poziciji mv.start/mv.end.
        const ms=mv.start, me=mv.end, mt=me-ms;
        if(me<=ws || ms>=weEff) return; // van dana
        const dt=(now!==null)? ms-now : Infinity;
        let fill=PD.boje[t.pid];
        if(hasT5P(t)){
            fill='#616161';   // test-precica (toggleDoneP) -- odmah sivo, NEZAVISNO od sata
        } else if(now!==null){
            if(me<=now)                            fill='#616161'; // gotova
            else if(ms<=now)                       fill='#1B5E20'; // aktivna
            else if(dt>0 && dt<=PD.signal_min)    fill='#E65100'; // upozorenje
        }
        shapes.push({type:'rect',x0:CX(ms),x1:CX(me),
            y0:y-.37,y1:y+.37,fillcolor:fill,opacity:1,
            line:t.nastavak?{color:t.razlog_nastavka==='potvrdjeno'?'#2E7D32':'#FB8C00',width:2.5}:{color:'#fff',width:1},layer:'above'});
        if(mt>=80){
            ann.push({x:(CX(ms)+CX(me))/2,y,
                text:(t.nastavak?(t.razlog_nastavka==='potvrdjeno'?'✓ ':'⟳ '):'')+t.operacija+'<br><b>'+ozn(t)+'</b>',
                showarrow:false,font:{size:8,color:'#fff'},
                xanchor:'center',yanchor:'middle',xref:'x',yref:'y',cliponaxis:true});
        }
        if(mt>=25){
            const od=Math.max(2,mt*.03);
            ann.push({x:CX(ms)+od,y:y+.38,text:String(t.id_poc),
                showarrow:false,font:{size:7,color:'#ddd'},
                xanchor:'left',yanchor:'bottom',xref:'x',yref:'y'});
            ann.push({x:CX(me)-od,y:y+.38,text:String(t.id_zav),
                showarrow:false,font:{size:7,color:'#ddd'},
                xanchor:'right',yanchor:'bottom',xref:'x',yref:'y'});
        }
        // Ušteda Tpz — praznina izmedju korigovanog kraja (me) i izvornog Fini-plan
        // kraja (t.kraj), nastala konsolidacijom pripremno-zavrsnog vremena. Bez ovoga
        // menadzer vidi blok koji se "ne poklapa" sa rokom/krajem perioda i to deluje
        // kao greska. Isti kriterijum (ustedaSeg) koristi i buildPretTraces() za hover.
        const seg=ustedaSeg(t,moved);
        if(seg){
            const hs=Math.max(seg.hs,ws), he=Math.min(seg.he,weEff), hw=he-hs;
            if(hw>0.5){
                shapes.push({type:'rect',x0:CX(hs),x1:CX(he),y0:y-.37,y1:y+.37,
                    fillcolor:'#90A4AE',opacity:0.32,
                    line:{color:'#546E7A',width:1,dash:'dot'},layer:'above'});
                if(hw>=30){
                    ann.push({x:(CX(hs)+CX(he))/2,y,
                        text: hw>=70 ? 'Ušteda Tpz<br>'+Math.round(hw)+' min' : 'Ušteda Tpz',
                        showarrow:false,font:{size:7,color:'#37474F'},
                        xanchor:'center',yanchor:'middle',xref:'x',yref:'y',cliponaxis:true});
                }
            }
        }
    });

    // RUCNO POMERENE operacije (ljubicast) — na vrhu, sa konektorom stara→nova
    mvOverlay.forEach(o=>{
        const t=o.t, mv=o.mv, y=o.y;
        const col=mv.pinned?'#4A148C':'#7B1FA2';
        const oy=rm[t.rm];
        if(oy!==undefined)
            shapes.push({type:'line',x0:(CX(t.pocetak)+CX(t.kraj))/2,x1:(CX(mv.start)+CX(mv.end))/2,
                y0:oy,y1:y,line:{color:col,width:1.2,dash:'dot'},layer:'above'});
        shapes.push({type:'rect',x0:CX(mv.start),x1:CX(mv.end),y0:y-.37,y1:y+.37,
            fillcolor:PD.boje[t.pid],opacity:0.97,
            line:{color:col,width:mv.pinned?3:2},layer:'above'});
        const inset=Math.max(1.5,(CX(mv.end)-CX(mv.start))*.025);
        ann.push({x:CX(mv.start)+inset,y,text:'<b>'+Math.round(mv.start)+'</b>',showarrow:false,
            font:{size:9,color:'#fff'},xanchor:'left',yanchor:'middle',xref:'x',yref:'y'});
        ann.push({x:CX(mv.end)-inset,y,text:'<b>'+Math.round(mv.end)+'</b>',showarrow:false,
            font:{size:9,color:'#fff'},xanchor:'right',yanchor:'middle',xref:'x',yref:'y'});
        const dlt=mv.delta>=0?('+'+mv.delta):(''+mv.delta);
        ann.push({x:(CX(mv.start)+CX(mv.end))/2,y:y+.21,
            text:(mv.pinned?'✋ ':'')+'<b>'+ozn(t)+'</b> '+t.operacija+' &#916;'+dlt,
            showarrow:false,font:{size:8,color:'#fff'},xanchor:'center',yanchor:'middle',
            xref:'x',yref:'y',cliponaxis:true});
        // Ušteda Tpz i u "duh" (overlay) prikazu — ISTI kriterijum kao normalan blok
        // (vidi ustedaSeg). Bez ovoga, cim BILO GDE u planu postoji jedan rucni pin,
        // sva Tpz-konsolidovana ušteda u celom planu nestaje iz prikaza (svaka takva
        // operacija prelazi u ovu granu), iako je stvarna ušteda i dalje nepromenjena.
        // Odsustvo sege ovde (npr. posle razdvajanja partija drugom operacijom) je
        // istovremeno i vizuelna potvrda da je Tpz VRACEN — operacija opet placa pun
        // iznos, nema vise sta da se osenci.
        const segOv=ustedaSeg(t,moved);
        if(segOv){
            const hs=Math.max(segOv.hs,ws), he=Math.min(segOv.he,weEff), hw=he-hs;
            if(hw>0.5){
                shapes.push({type:'rect',x0:CX(hs),x1:CX(he),y0:y-.37,y1:y+.37,
                    fillcolor:'#90A4AE',opacity:0.32,
                    line:{color:'#546E7A',width:1,dash:'dot'},layer:'above'});
                if(hw>=30){
                    ann.push({x:(CX(hs)+CX(he))/2,y,
                        text: hw>=70 ? 'Ušteda Tpz<br>'+Math.round(hw)+' min' : 'Ušteda Tpz',
                        showarrow:false,font:{size:7,color:'#37474F'},
                        xanchor:'center',yanchor:'middle',xref:'x',yref:'y',cliponaxis:true});
                }
            }
        }
    });

    // Senke pauza (preko operacija) — clock-prostor; blok se proteže preko pauze
    pauzeShapes(ws,weEff,-.5,n-.5).forEach(s=>shapes.push(s));

    // Granice dana
    shapes.push({type:'line',x0:CX(ws),x1:CX(ws),y0:-.5,y1:n-.5,
        line:{color:'#1565C0',width:1.5,dash:'dot'}});
    shapes.push({type:'line',x0:CX(we),x1:CX(we),y0:-.5,y1:n-.5,
        line:{color:'#1565C0',width:1.5,dash:'dot'}});

    // Zona 5 min ispred svake operacije (uvek vidljiva) — na efektivnoj poziciji
    PD.termini.forEach(t=>{
        if(blokiranoNastavkom(t)) return;   // u toku (bez T5), ili tehnoloski zavisi od njega
        const p=effPos(t);
        if(p.e<=ws || p.s>=weEff) return;
        if(!(p.rm in rm)) return;
        const y=rm[p.rm];
        const szS=Math.max(ws, p.s-PD.signal_min);
        const szE=Math.min(weEff, p.s);
        if(szE>szS){
            shapes.push({type:'rect',x0:CX(szS),x1:CX(szE),y0:y-.37,y1:y+.37,
                fillcolor:'rgba(255,152,0,.22)',
                line:{color:'rgba(255,120,0,.55)',width:1,dash:'dot'},
                layer:'below'});
        }
    });

    // "Sada" linija — uvek kad je now poznat i u prozoru
    if(now!==null && now>=ws && now<=weEff){
        shapes.push({type:'line',x0:CX(now),x1:CX(now),y0:-.5,y1:n-.5,
            line:{color:'#F44336',width:3}});
        ann.push({x:CX(now),y:n-.3,text:'<b>SADA</b> '+kalSadaTxt(now),
            showarrow:true,arrowhead:2,arrowcolor:'#F44336',
            font:{size:10,color:'#F44336'},xanchor:'left',yanchor:'bottom',
            xref:'x',yref:'y',bgcolor:'rgba(255,255,255,.85)',borderpad:2});
    }

    // OSA U PLAN-MINUTAMA: tick na clock-poziciji CX(pm), natpis = pm (kao osa/rok);
    // pauze su osencena polja, blokovi rastegnuti preko njih. (vidi Podelu)
    const _step=Math.max(60,Math.round((weEff-ws)/8/30)*30);
    const _tv=[], _tt=[];
    for(let pm=ws; pm<=weEff+0.5; pm+=_step){ _tv.push(CX(pm)); _tt.push(Math.round(pm)); }
    if(_tt.length===0||_tt[_tt.length-1]!==Math.round(weEff)){ _tv.push(CX(weEff)); _tt.push(Math.round(weEff)); }
    kalOsa(_tt);   // stvarno vreme na osi (grupa A3)
    return{
        xaxis:{range:[CX(ws),CX(weEff)+(weEff>we?30:0)],showgrid:true,gridcolor:'#E0E0E0',
               tickvals:_tv,ticktext:_tt,
               title:{text:kalOsaNaslov('Vreme (plan-min; pauza = osenčeno polje, blok se proteže preko nje)'),font:{size:10}}},
        yaxis:{tickvals:PD.rm_lista.map((_,i)=>i),ticktext:PD.rm_lista,
               range:[-.6,n-.4],showgrid:false},
        height:Math.max(300,n*72+100),
        shapes,annotations:ann,
        plot_bgcolor:'white',paper_bgcolor:'#FAFAFA',
        margin:{l:48,r:6,t:18,b:36},hovermode:'closest',dragmode:'pan'
    };
}

// Tabla menadzera: obavestenje kojim RM period pocinje nedovrsenim (prenetim)
// operacijama iz proslog perioda — one se izvrsavaju PRVE, a novi (narocito
// push) proizvodi se propagacijom guraju iza njih. Staticno za ceo period
// (markira ih prelaz u novi period), pa se popunjava jednom pri ucitavanju.
function initNastavakBar(){
    const bar=document.getElementById('nastavakBar'); if(!bar) return;
    const poRm={};
    PD.termini.forEach(t=>{
        if(t.nastavak) (poRm[t.rm]||(poRm[t.rm]=[])).push(
            ozn(t)+'/'+t.operacija+(t.razlog_nastavka==='potvrdjeno'?' (✓ potvrđeno)':''));
    });
    const rms=Object.keys(poRm).sort();
    if(!rms.length){ bar.style.display='none'; return; }
    const spisak=rms.map(rm=>'<b>'+rm+'</b> — '+poRm[rm].join(', ')).join(';&nbsp;&nbsp; ');
    const ukupno=rms.reduce((a,rm)=>a+poRm[rm].length,0);
    if(ukupno<=10){   // kratko -- ceo spisak u jednom redu, kao ranije
        bar.innerHTML='<b>⟳ Period počinje nedovršenim operacijama iz prošlog perioda:</b>  '
            +spisak+'.  Nove operacije se planiraju iza njih.';
    } else {           // dugo (nalaz 2026-09-29: zid teksta) -- sazetak po RM, spisak na klik
        bar.innerHTML='<b>⟳ Period počinje nedovršenim operacijama iz prošlog perioda:</b> '
            +ukupno+' operacija ('+rms.map(rm=>rm+': '+poRm[rm].length).join(', ')+'). '
            +'Nove operacije se planiraju iza njih. '
            +'<a href="#" id="nastavakTg" style="color:#BF360C;font-weight:600">prikaži spisak</a>'
            +'<div id="nastavakLista" style="display:none;max-height:140px;overflow:auto;margin-top:4px">'+spisak+'</div>';
        document.getElementById('nastavakTg').onclick=function(ev){
            ev.preventDefault();
            const l=document.getElementById('nastavakLista'), otv=l.style.display==='none';
            l.style.display=otv?'block':'none';
            this.textContent=otv?'sakrij spisak':'prikaži spisak';
            try{ Plotly.Plots.resize('pg'); }catch(e){}
        };
    }
    bar.style.display='block';
}

// Tick — osvezavanje (15 sec)

function tick(){
    const dot=document.getElementById('rdot');
    dot.classList.add('u');
    setTimeout(()=>dot.classList.remove('u'),600);

    const now=nowMin();

    // Info
    document.getElementById('ptv').textContent=
        now!==null? Math.round(now)+' min' : '—';

    // Odredi koji dan prikazati
    let dispDan=(sadaMode && now!==null)? curDan(now) : selDan;
    const [ws,we]=danOpseg(dispDan);

    // Info o danu desno
    document.getElementById('si').textContent=
        danLabel(dispDan)+' | '+ws+'–'+we+' min';

    // Staticni plan: highlight
    if(staticOk){
        Plotly.react('sg',straces,staticLayout(dispDan));
    }

    // Pretpodela — now se uvek prosledjuje ako je poznat
    const displayNow = now;
    // VAZAN REDOSLED: pretLayout() prvo (unutra zove computeMoved(), osvezava
    // lastMoved/lastTpzStat), PA TEK ONDA buildPretTraces() — da hover markeri
    // koriste SVEZU (ne proslu-tick) Tpz-korigovanu poziciju preko effPos().
    const _pretplan = pretLayout(ws,we,displayNow);
    buildPretTraces();   // svaki tick — vidi napomenu iznad definicije
    if(!pretOk){
        pretOk=true;
        Plotly.newPlot('pg',ptraces,_pretplan,
            {responsive:true,scrollZoom:true,displayModeBar:false});
        mvAttach();   // drag-listeneri za rucno premestanje (jednom, na #pg)
        // Klik (ne drag) na blok -> test-precica T1/T5 (vidi toggleDoneP). Kad je
        // moveMode ukljucen, mvAttach() presrece mousedown pre Plotly-ja (stopPropagation)
        // pa plotly_click tada ne okida -- klik za T1/T5 i drag NIKAD se ne sudaraju.
        document.getElementById('pg').on('plotly_click',data=>{
            if(!data||!data.points||!data.points[0]) return;
            const px=data.points[0].x, py=data.points[0].y;
            const rmName=PD.rm_lista[Math.round(py)];
            if(!rmName) return;
            const hit=doneHit(px,rmName);
            if(hit) toggleDoneP(hit);
        });
    } else {
        Plotly.react('pg',ptraces,_pretplan);
    }

    // Tpz-usteda (racuna se unutar pretLayout->computeMoved, sad je svez) + objava plana
    if(lastTpzStat){
        const ustedjeno=Math.round(lastTpzStat.baked-lastTpzStat.correct);
        document.getElementById('si').textContent += ustedjeno>0
            ? '  |  Tpz uskl.: '+Math.round(lastTpzStat.correct)+' min (usteđeno '+ustedjeno+' min)'
            : '  |  Tpz uskl.: '+Math.round(lastTpzStat.correct)+' min';
    }
    // TRAJNA (ne samo prolazna tost) oznaka -- korisnikova odluka 2026-09-14:
    // ovo NIJE nesto sto sme da prodje neprimeceno posle jednog toast-a koji
    // moze da se zatvori/promasi.
    if(lastNovoPrekoraceno && lastNovoPrekoraceno.length){
        document.getElementById('si').textContent +=
            '  |  ⚠ '+lastNovoPrekoraceno.length+' stavka(e) živi prikaz gura preko kraja perioda (nije u planu!)';
    }
    publishPlan();

    // Signali (samo u sada modu)
    if(sadaMode && now!==null) checkSignals(now);
}

// ════ OBJAVA KONACNOG RASPOREDA (za Podelu rada na RM — Nivo 2) ════════════
// Nivo 2 vise ne racuna sopstveni raspored; cita ovaj kljuc i samo prikazuje
// (osencena kopija). Identitet stavke isti kao mvKey (pid|rm|pocetak).
let _lastPubStr=null, _lastPubTime=null;
function publishPlan(){
    if(!lastMoved) return;
    const items={};
    // 'tpz' (korisnikova odluka 2026-09-11) -- da li OVA stavka, u TRENUTNOM
    // (eventualno rucno pomerenom) rasporedu, i dalje NE placa Tpz -- suprotno
    // od 'prvi' (firstInRun): prvi u nizu UVEK placa pun Tpz. Bez ovoga Podela/RK
    // ne mogu da znaju da je pomeranje razdvojilo/spojilo Tpz-konsolidovan par
    // (vidi applyPublishedPlan, buildPodTraces).
    lastMoved.forEach((mv,t)=>{ items[t.pid+'|'+t.rm+'|'+t.pocetak]={s:mv.start,e:mv.end,rm:mv.rm,tpz:!mv.prvi}; });
    const str=JSON.stringify(items);
    // Dijagnostika (korisnikov nalaz 2026-09-11) -- ispisati poslednju objavu
    // BEZ OBZIRA da li se ovaj put promenila (da se vidi da mehanizam uopste
    // radi, ne samo kad nesto novo upise).
    const el=document.getElementById('si');
    if(el && _lastPubTime) el.textContent += '  |  Objava: '+_lastPubTime.toLocaleTimeString()+
        ' ('+Object.keys(items).length+' st.)';
    if(str===_lastPubStr) return;   // bez promene — preskoci upis (izbegava nepotreban storage event)
    _lastPubStr=str;
    _lastPubTime=new Date();
    localStorage.setItem('plan_'+ODP, JSON.stringify({ts:Date.now(), items}));
}

// Signali — na efektivnim (eventualno pomerenim) pozicijama
function checkSignals(now){
    const toS=[];
    PD.termini.forEach(t=>{
        if(blokiranoNastavkom(t)) return;   // u toku (bez T5), ili tehnoloski zavisi od njega
        const p=effPos(t);
        const key=t.pid+'_'+t.rm+'_'+t.pocetak;
        const dt=p.s-now;
        if(dt>PD.signal_min){ sigSet.delete(key); return; }
        if(dt>0 && dt<=PD.signal_min && !sigSet.has(key)){
            sigSet.add(key); toS.push({t,p});
        }
    });
    if(toS.length>0){
        if(soundOn) playWarn();
        showToast('⚠ SIGNAL — '+toS.map(o=>
            ozn(o.t)+' '+o.t.operacija+' @ '+o.p.rm+' za '+Math.ceil(o.p.s-now)+' min'
        ).join(' | '));
    }
}

// Init
function init(){
    buildButtons();

    // planStart: vreme generisanja HTML-a (automatski iz Pythona)
    planStart = new Date(PD.plan_start_ts);

    // Opcioni override: datum_pocetka_perioda iz parametri.csv
    if(PD.datum){
        planStart=new Date(PD.datum.replace(' ','T'));
        document.getElementById('di').value=toDTL(planStart);
    }
    // KONTINUITET VREMENA KROZ PERIODE (korisnikova odluka 2026-09-27: poremecaj otvoren
    // u proslom periodu se NASTAVLJA i zatvara u novom, ulazi u produzenje i u bazu
    // poremecaja). Trajanje takvog poremecaja je razlika dva trenutka iz DVA perioda, pa
    // sat novog perioda mora da pocne TACNO gde je prethodni stao: ps_Pn = ps_P(n-1) +
    // kapacitet PRETHODNOG perioda (PD.kap_prethodnog -- pri prelazu se broj smena vraca
    // na 1, pa je kapacitet novog perioda cesto manji). Sat Podele je PLAN-sat (neprekidan,
    // bez noci/vikenda); kalendarski datumi su u dokumentima i Grubom planu.
    { const _pp=(PD.period||1)>1 ? localStorage.getItem('ps_'+PD.odeljenje+'_P'+((PD.period||1)-1)) : null;
      const _d=_pp ? new Date(new Date(_pp).getTime()+(PD.kap_prethodnog||PD.kapacitet)*60000) : null;
      if(_d && !isNaN(_d)){ planStart=_d; document.getElementById('di').value=toDTL(planStart); } }
    // Rucni override iz localStorage — ucitaj planStart i simSpeed zajedno
    const stored=localStorage.getItem(LS);
    if(stored){
        planStart=new Date(stored);
        simSpeed=parseFloat(localStorage.getItem(LS+'_spd'))||1;
        document.getElementById('di').value=toDTL(planStart);
        [1,60,600,6000].forEach(v=>{
            const b=document.getElementById('sp'+v);
            if(b) b.classList.toggle('sel',v===simSpeed);
        });
    } else {
        setSpeed(1);
    }

    // Zvuk signala -- sistemska postavka (atributi_sistema.csv: zvuk_signala,da|ne; dugme
    // uklonjeno sa table 2026-09-30). Pregledac pusta zvuk tek posle PRVE radnje korisnika na
    // stranici -- AudioContext se zato otkljucava prvim klikom/tasterom.
    soundOn = PD.zvuk_signala!==false;
    ['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{ try{ ensAudio(); }catch(e){} },{once:true}));

    // Van TEST REZIMA (atributi_sistema.csv: test_precice,ne -- pogon) tabla nema Sim kontrola
    // ni plan-minuta (korisnikova odluka 2026-09-30), pa sat tece sam, u realnom vremenu -- isti
    // kljucevi i formula kao 'Realno vreme' u Podeli (svi prozori racunaju isti sat).
    // Kalendarski sat (noci, pauze) dolazi u grupi A.
    if(!TEST_PRECICE){
        document.querySelectorAll('.tst').forEach(e=>{ e.style.display='none'; });
        // kalendarski sat: pocetak plana = pocetak perioda (planStart iz PD.datum / kontinuiteta)
        if(!localStorage.getItem(LS)){ if(!(kalPogon() && planStart && !isNaN(planStart))) planStart=new Date(); localStorage.setItem(LS,planStart.toISOString()); }
        if(localStorage.getItem(LS+'_rt')!=='1'){
            localStorage.setItem(LS+'_rt_base', String(parseFloat(localStorage.getItem(LS+'_now'))||0));
            localStorage.setItem(LS+'_rt_anchor', String(Date.now()));
            localStorage.setItem(LS+'_rt','1');
        }
        setInterval(()=>{
            if(localStorage.getItem(LS+'_rt')!=='1') return;
            const base=parseFloat(localStorage.getItem(LS+'_rt_base'))||0;
            const anchor=parseFloat(localStorage.getItem(LS+'_rt_anchor'))||Date.now();
            localStorage.setItem(LS+'_now', String(kalPogon() ? kalSad() : base+(Date.now()-anchor)/60000));
        }, 500);
    }

    // Datum input
    document.getElementById('di').addEventListener('change',()=>{
        const v=document.getElementById('di').value;
        if(!v) return;
        planStart=new Date(v);
        localStorage.setItem(LS,planStart.toISOString());
        sigSet.clear();
        tick();
    });

    initNastavakBar();
    buildStatic();

    // Po defaultu: ako ima datum -> sada mod; inace -> Dan 1
    if(planStart && !isNaN(planStart)){
        gSada();
    } else {
        sadaMode=false; selDan=1;
        setSelBtn('dan',1);
        tick();
    }

    setInterval(tick,2000);

    // Sinhronizacija planStart+simSpeed sa drugim tabovima
    window.addEventListener('storage',e=>{
        // pomeraji (mv_) ili done_ promenjeni u drugom tabu → samo precrtaj
        if(e.key && (e.key.indexOf('mv_'+ODP+'_')===0 ||
                     e.key.indexOf('done_'+ODP)===0)){ tick(); return; }
        if(e.key!==LS && e.key!==LS+'_spd' && e.key!==LS+'_now') return;
        const psVal=localStorage.getItem(LS);
        const spdVal=parseFloat(localStorage.getItem(LS+'_spd'))||1;
        if(psVal){ planStart=new Date(psVal); document.getElementById('di').value=toDTL(planStart); }
        simSpeed=spdVal;
        [1,60,600,6000].forEach(v=>{
            const b=document.getElementById('sp'+v);
            if(b) b.classList.toggle('sel',v===simSpeed);
        });
        sigSet.clear(); tick();
    });
}

// Sat — pokrece se odmah, nezavisno od Plotly-ja i init()
function clkTick(){
    const n=new Date(sadaMs()),p=x=>String(x).padStart(2,'0');
    const el=document.getElementById('clock');
    if(el) el.textContent=p(n.getHours())+':'+p(n.getMinutes())+':'+p(n.getSeconds());
}
clkTick();
setInterval(clkTick,1000);

window.addEventListener('load',init);
