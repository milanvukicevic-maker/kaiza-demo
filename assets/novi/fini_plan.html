<script>
(function(){
  function init(){
    var gd = document.querySelector('.plotly-graph-div');
    if (!gd || !gd.on || !gd.layout || !window.Plotly) { setTimeout(init, 300); return; }
    var css = 'position:fixed;z-index:9999;font:13px "Segoe UI",Arial,sans-serif;background:#fff;'
            + 'border:1px solid #bbb;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.2)';
    var box = document.createElement('div');
    box.style.cssText = css + ';right:14px;bottom:14px;max-width:460px;padding:10px 30px 10px 12px;display:none;line-height:1.45';
    document.body.appendChild(box);
    gd.on('plotly_click', function(ev){
      var p = ev && ev.points && ev.points[0]; if (!p) return;
      var t = p.hovertext || p.text || ''; if (!t) return;
      box.innerHTML = '<span style="position:absolute;right:9px;top:4px;cursor:pointer;font-size:18px;color:#888" title="Zatvori">&times;</span>' + t;
      box.firstChild.onclick = function(){ box.style.display = 'none'; };
      box.style.display = 'block';
    });
    var inp = document.createElement('input');
    inp.type = 'search'; inp.placeholder = 'Traži RN, proizvod ili detalj…';
    inp.title = 'Ističe blokove čiji naziv sadrži tekst; klik na blok fiksira njegov opis';
    inp.style.cssText = css + ';left:14px;bottom:14px;padding:6px 10px;min-width:250px';
    document.body.appendChild(inp);
    var izvorni = null;
    inp.addEventListener('input', function(){
      var f = inp.value.trim().toLowerCase(), sh = gd.layout.shapes || [];
      if (!izvorni) izvorni = sh.map(function(s){ return s.opacity === undefined ? 1 : s.opacity; });
      Plotly.relayout(gd, {shapes: sh.map(function(s, i){
        var o = Object.assign({}, s);
        if (s.name) o.opacity = !f ? izvorni[i] : (String(s.name).toLowerCase().indexOf(f) >= 0 ? 1 : 0.12);
        return o;
      })});
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script><script>/* demo (sajt): pocetni prikaz uvecan na operacije plana */
window.addEventListener('load', function(){ setTimeout(function(){ try {
  document.querySelectorAll('.js-plotly-plot').forEach(function(g){
    var lo = Infinity, hi = -Infinity;
    g.data.forEach(function(d){ (Array.isArray(d.x) ? d.x : []).forEach(function(v){
      if (typeof v === 'number') { if (v < lo) lo = v; if (v > hi) hi = v; } }); });
    if (isFinite(lo) && hi > lo) Plotly.relayout(g, {'xaxis.range': [lo - (hi - lo) * 0.02, hi + (hi - lo) * 0.02]});
  });
} catch (e) {} }, 400); });
